<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exclusive Lead Tracker · Proposal 2 · Month calendar and rings</title><link rel="stylesheet" href="shared.css">
<style>
.top-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 16px 16px}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;text-align:center;letter-spacing:.04em}
.day{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;text-align:left;cursor:pointer;min-height:84px;display:flex;flex-direction:column;gap:2px}
.day:hover{border-color:var(--brand-400)}
.day[aria-pressed=true]{background:var(--soft);border-color:var(--brand-500);box-shadow:0 0 0 2px var(--brand-200)}
.day .n{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.day .k{font-size:12px;color:var(--muted)}
.day.future{background:transparent;border-style:dashed;cursor:default;color:var(--muted)}
.day.empty{border:0;background:none;cursor:default}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px}.tile .l{font-size:12px;color:var(--muted);font-weight:600}.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:1279px){.top-grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="side" data-sidebar></aside><div class="main-col"><header class="top" data-topbar></header>
<main>
  <div id="head"></div>
  <div class="top-grid">
    <section class="card" aria-label="November calendar"><div class="panel-h"><h2>November 2026 · pick a day</h2><div class="legend"><span><i class="dot" style="background:var(--muted)"></i>100-lead history</span><span><i class="dot d-carry"></i>first 250 day</span></div></div><div class="cal" id="cal"></div></section>
    <section class="card" aria-label="Month goals"><div class="panel-h"><h2>Month goals · Joanna Paclibare</h2><span class="xs muted">as of Nov 5</span></div><div class="rings" id="rings"></div>
      <div class="pad" style="border-top:1px solid var(--line);display:grid;gap:14px" id="side-m"></div>
      <div class="pad xs muted" style="border-top:1px solid var(--line)"><b style="color:var(--ink)">7,000 leads</b> all month, 250 a day. Her leads stay hers. Orders target 54 is <b>to confirm</b>.</div></section>
  </div>
  <section class="card mb" id="detail"></section>
  <div id="table"></div>
</main></div></div>
<dialog id="settings" aria-labelledby="st"><div class="dlg-h"><div><h2 id="st" style="font-size:18px">Settings · Exclusive Lead Tracker</h2><p class="sub">Transfer a CRA into this page</p></div><button class="x" data-close-dialog aria-label="Close">×</button></div>
  <div class="dlg-b" data-settings-body></div><div class="dlg-f" data-settings-foot data-close="data-close-dialog"></div></dialog>
<script src="shared.js"></script>
<script>
let day = 6;
function page(){
  document.getElementById('head').innerHTML = pageHead('Pick a day on the calendar, then update her leads below',
    `<button class="btn" data-open="settings" type="button">${svg('gear','width:16px;height:16px')} Settings</button>`);
  document.querySelector('[data-open=settings]').onclick=()=>document.getElementById('settings').showModal();
  document.getElementById('rings').innerHTML=
    donut(MONTH.leads,7000,'var(--brand-500)','Leads','250 a day')+
    donut(MONTH.repeat,1400,'var(--twice)','Repeat purchases','Goal 20% = 1,400')+
    donut(MONTH.orders,54,'var(--rand)','Confirmed orders','Target 54 · to confirm');
  document.getElementById('side-m').innerHTML=meter('AOV (₱)',MONTH.aov,895,'var(--carry)',{tail:'<span class="bad b">₱15 below</span> the ₱895 threshold'})+
    `<div><p class="sm b" style="margin-bottom:4px">Mix so far (650 leads)</p>${mixBar([127,277,246])}${mixLegend([127,277,246])}</div>`;
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let h=dows.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let n=1;n<=30;n++){const x=DAYS[n];
    if(!x){h+=`<div class="day future" aria-disabled="true"><span class="n">${n}</span><span class="k">250 leads</span></div>`;continue;}
    h+=`<button class="day" data-d="${n}" aria-pressed="${n===day}"><span class="n">${n}${x.next?'<i class="dot d-carry" title="First 250-lead day"></i>':x.today?'<span class="chip" style="background:var(--soft);color:var(--soft-ink);padding:0 6px;font-size:10px">today</span>':''}</span><span class="k num">${x.leads} leads</span><span class="k num">${x.next?'88 left over':x.repeat+' repeat'}</span>${x.next?'':`<span class="k num">${x.orders} order${x.orders===1?"":"s"}</span>`}</button>`;}
  document.getElementById('cal').innerHTML=h;
  document.querySelectorAll('.day[data-d]').forEach(b=>b.onclick=()=>{day=+b.dataset.d;draw();});
  draw();
  if(location.hash==='#settings')document.getElementById('settings').showModal();
}
function draw(){
  document.querySelectorAll('.day[data-d]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.d===day));
  const d=DAYS[day], c=d.carry;
  const tile=(l,v,s)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="xs muted">${s}</div></div>`;
  const target=d.hist?100:250;
  document.getElementById('detail').innerHTML=`<div class="panel-h"><h2>${dLong(day)} · ${d.leads} leads${d.hist?' · history':d.next?' · opens tomorrow':' · today'}</h2><span class="xs muted">Daily goal: 50 repeat purchases (20% of 250) · AOV ₱895</span></div>
  <div class="tiles">${tile('Repeat purchases',d.next?'0 <small>/ 50</small>':`${d.repeat} <small>/ ${d.hist?20:50}</small>`,d.hist?'Out of 100 leads (20%)':'Goal 20% of 250')}
  ${tile('Confirmed orders',d.next?'0':d.orders,'Monthly target 54 · to confirm')}
  ${tile('AOV',d.aov?'₱'+d.aov:'—',d.aov?(d.aov>=895?'Meets ₱895':`₱${895-d.aov} below ₱895`):'No orders yet')}
  ${tile('Leads worked',d.next?'0':(d.worked!=null?d.worked:d.leads)+' <small>/ '+d.leads+'</small>',d.left!=null&&!d.next?d.left+' left over → Nov 6':d.next?'Not started':'All handled')}</div>
  <div style="padding:0 16px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center"><div><p class="xs b muted" style="margin-bottom:4px">Daily mix by priority</p>${mixBar(d.mix)}${mixLegend(d.mix)}</div>
  ${c?`<div class="note" style="background:#fde3da;color:#6b2410;border:1px solid #f1b9a4"><b>${c.reduce((a,b)=>a+b)} left over from Nov 5</b> (${c[0]} VIP · ${c[1]} twice · ${c[2]} random)<br>+ <b>${d.fresh.reduce((a,b)=>a+b)} fresh</b> = 250</div>`:''}</div>`;
  document.getElementById('table').innerHTML=leadTable({day,rows:25,maxH:520});
}
</script></body></html>
